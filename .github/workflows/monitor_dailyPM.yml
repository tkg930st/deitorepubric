name: 2. Trade Monitor PM

on:
  schedule:
    # JST 月-金 12:00 (UTC 月-金 03:00) に起動
    - cron: '31 2 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    # ファイルをリポジトリに書き戻すために書き込み権限を付与
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # ここを 3.12 に変更
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz python-dotenv xlrd holidays pandas-ta

      - name: Check Japan Holiday
        id: holiday_check
        run: |
          python -c "
          import holidays, pytz, sys
          from datetime import datetime
          jst = pytz.timezone('Asia/Tokyo')
          if datetime.now(jst) in holidays.Japan():
              print('Today is a holiday in Japan. Skipping...')
              sys.exit(1)
          "
        # 祝日の場合はここでジョブを終了させる
        continue-on-error: false

      - name: Run Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # PMセッション: 後場（12:30〜15:00）を監視
          # 14:55に自己終了させ、ワークフロータイムアウト(190分)より先に正常終了
          MONITOR_END_TIME: '14:55'
          MAX_RUNTIME_MINUTES: '180'
        # PM: 12:00〜15:00（約180分）で停止
        timeout-minutes: 190
        run: python monitor.py

      - name: Clear positions.json
        if: always()
        run: |
          # 15:00終了時にポジションデータを消去
          echo '{}' > positions.json
          echo "positions.json cleared."

      - name: Commit and Push trade records
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 作成された可能性のあるファイルを個別にチェックして追加
          # ファイルが存在する場合のみ追加することで、ワイルドカードのエラーを回避します
          ls *.csv 2>/dev/null && git add *.csv || echo "No CSV files found"
          ls *.json 2>/dev/null && git add *.json || echo "No JSON files found"
          ls *.txt 2>/dev/null && git add *.txt || echo "No log files found"

          # 変更（ステージングされたファイル）がある場合のみコミット
          if ! git diff --cached --quiet; then
            git commit -m "Update trade records and logs [skip ci]"
            # リモートの最新変更を取り込んでからプッシュ（並行ワークフローとの競合回避）
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit."
          fi
