name: 2. Trade Monitor PM

on:
  schedule:
    # JST 月-金 10:30 (UTC 月-金 01:30) に起動
    # 12:30開始のため2時間前に起動 → 最大2時間のスケジューラ遅延が発生しても12:30から監視可能
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    # ファイルをリポジトリに書き戻すために書き込み権限を付与
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # ここを 3.12 に変更
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz python-dotenv xlrd holidays pandas-ta

      - name: Check Japan Holiday
        id: holiday_check
        run: |
          python -c "
          import holidays, pytz, sys
          from datetime import datetime
          jst = pytz.timezone('Asia/Tokyo')
          if datetime.now(jst) in holidays.Japan():
              print('Today is a holiday in Japan. Skipping...')
              sys.exit(1)
          "
        # 祝日の場合はここでジョブを終了させる
        continue-on-error: false

      - name: Run Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # PMセッション: 10:30 JST起動 → 12:30まで待機 → 15:10に自己終了
          # スケジューラが2時間遅延しても 12:30 JSTから監視開始可能
          MONITOR_START_TIME: '12:30'
          FORCE_CLOSE_TIME: '14:50'
          MONITOR_END_TIME: '15:10'
          # 後場終了時に1日分の取引サマリーをDiscordに送信
          SKIP_DAILY_SUMMARY: 'false'
          MAX_RUNTIME_MINUTES: '300'
          # ③ 後場エントリーカットオフ: 14:00以降は新規エントリーしない（大引け前を回避）
          ENTRY_CUTOFF_TIME: '14:00'
        # 10:30〜15:10 = 最大310分のタイムアウト（余裕を持たせる）
        timeout-minutes: 310
        run: python monitor.py

      - name: Clear positions.json
        if: always()
        run: |
          # 15:00終了時にポジションデータを消去
          echo '{}' > positions.json
          echo "positions.json cleared."

      - name: Commit and Push trade records
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 作成された可能性のあるファイルを個別にチェックして追加
          # ファイルが存在する場合のみ追加することで、ワイルドカードのエラーを回避します
          ls *.csv 2>/dev/null && git add *.csv || echo "No CSV files found"
          ls *.json 2>/dev/null && git add *.json || echo "No JSON files found"
          ls *.txt 2>/dev/null && git add *.txt || echo "No log files found"

          # 変更（ステージングされたファイル）がある場合のみコミット
          if ! git diff --cached --quiet; then
            git commit -m "Update trade records and logs [skip ci]"
            # リモートの最新変更を取り込んでからプッシュ（並行ワークフローとの競合回避）
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit."
          fi
