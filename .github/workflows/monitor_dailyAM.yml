name: 2. Trade Monitor AM

on:
  schedule:
    # JST 月-金 07:30 (UTC 日-木 22:30) に起動
    # 09:30開始のため2時間前に起動 → 最大2時間のスケジューラ遅延が発生しても09:30から監視可能
    - cron: '30 22 * * 0-4'

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    # ファイルをリポジトリに書き戻すために書き込み権限を付与
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old execution logs
        run: |
          python3 -c "
          from datetime import datetime, timedelta, timezone
          import os
          log_file = 'execution_log.txt'
          if not os.path.exists(log_file):
              print('No log file found.')
              exit(0)
          jst = timezone(timedelta(hours=9))
          cutoff = (datetime.now(jst) - timedelta(days=5)).strftime('%Y-%m-%d')
          with open(log_file, 'r') as f:
              lines = f.readlines()
          kept = [l for l in lines if l[:10] >= cutoff or len(l.strip()) < 10]
          with open(log_file, 'w') as f:
              f.writelines(kept)
          print(f'Log cleanup: {len(lines)} -> {len(kept)} lines (cutoff: {cutoff})')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # ここを 3.12 に変更
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz python-dotenv xlrd holidays pandas-ta

      - name: Check Japan Holiday
        id: holiday_check
        run: |
          python -c "
          import holidays, pytz, sys
          from datetime import datetime
          jst = pytz.timezone('Asia/Tokyo')
          if datetime.now(jst) in holidays.Japan():
              print('Today is a holiday in Japan. Skipping...')
              sys.exit(1)
          "
        # 祝日の場合はここでジョブを終了させる
        continue-on-error: false

      - name: Run Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # AMセッション: 07:30 JST起動 → 09:30まで待機 → 11:35に自己終了
          # スケジューラが2時間遅延しても 09:30 JSTから監視開始可能
          MONITOR_START_TIME: '09:30'
          MONITOR_END_TIME: '11:35'
          # 前場はサマリーを送信しない（後場終了時に1日分をまとめて送信）
          SKIP_DAILY_SUMMARY: 'true'
          MAX_RUNTIME_MINUTES: '300'
          # ③ 前場エントリーカットオフ: 10:30以降は新規エントリーしない
          ENTRY_CUTOFF_TIME: '10:30'
          # ⑥ タイム・エグジット: 11:20に全ポジションを強制決済（前場引け前のリスク回避）
          FORCE_CLOSE_TIME: '11:20'
        # 07:30〜11:35 = 最大310分のタイムアウト（余裕を持たせる）
        timeout-minutes: 310
        run: python monitor.py

      - name: Commit and Push trade records
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 作成された可能性のあるファイルを個別にチェックして追加
          # ファイルが存在する場合のみ追加することで、ワイルドカードのエラーを回避します
          ls *.csv 2>/dev/null && git add *.csv || echo "No CSV files found"
          ls *.json 2>/dev/null && git add *.json || echo "No JSON files found"
          ls *.txt 2>/dev/null && git add *.txt || echo "No log files found"

          # 変更（ステージングされたファイル）がある場合のみコミット
          if ! git diff --cached --quiet; then
            git commit -m "Update trade records and logs [skip ci]"
            # リモートの最新変更を取り込んでからプッシュ（並行ワークフローとの競合回避）
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit."
          fi
