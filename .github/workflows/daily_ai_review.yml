name: Daily Gemini Review

on:
  schedule:
    - cron: '0 9 * * 1-5' # JST 月-金 18:00 (UTC 09:00) に実行（土日除外）
  workflow_dispatch: # 手動でいつでも実行できるようにするボタン

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Issueを作るために必要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Japan Holiday
        id: holiday_check
        run: |
          pip install holidays pytz > /dev/null 2>&1
          python -c "
          import holidays, pytz, sys
          from datetime import datetime
          jst = pytz.timezone('Asia/Tokyo')
          today = datetime.now(jst)
          if today in holidays.Japan():
              print('Today is a holiday in Japan. Skipping review.')
              sys.exit(1)
          print(f'Not a holiday: {today.strftime(\"%Y-%m-%d\")}')
          "
        continue-on-error: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Review
        id: gemini_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # スクリプトを実行し、結果をファイルに格納
          # stderr にはログが出力され、stdout にレビュー結果が出力される
          python gemini_reviewer.py > review_result.txt

      - name: Create Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 分析結果をGitHubのIssueとして投稿（ai-reviewラベル付き）
          gh issue create \
            --title "Daily AI Review: $(date +'%Y-%m-%d')" \
            --label "ai-review" \
            --body-file review_result.txt
