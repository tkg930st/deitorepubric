name: 1. Strategy Analyzer
on:
  schedule:
    - cron: '0 16 * * 0-4' # JST 火-土 01:00 (UTC 月-金 16:00)
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # ここを 3.12 に変更
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Japan Holiday
        id: holiday_check
        run: |
          python -c "
          import holidays, pytz, sys
          from datetime import datetime
          jst = pytz.timezone('Asia/Tokyo')
          if datetime.now(jst) in holidays.Japan():
              print('Today is a holiday in Japan. Skipping...')
              sys.exit(1)
          "
        # 祝日の場合はここでジョブを終了させる
        continue-on-error: false

      - name: Run Analyzer
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python analyzer.py
      - name: Commit and Push config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add best_config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update strategy config" && git push)
